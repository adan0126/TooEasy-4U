<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <form class="formulario">
      <h1>CREAR CUENTA</h1>

      <label for="username">Nombre de usuario</label>
      <input type="text" id="Nombre" placeholder="Nombre de usuario">

      <label for="password">Contraseña</label>
      <input type="password" id="contraseña" placeholder="Contraseña">

      <label for="security">Palabra de seguridad</label>
      <input type="text" id="seguridad" placeholder="Palabra para recuperar contraseña">

      <div class="terms">
        <input type="checkbox" id="terminos">
        <label for="terms">Términos y condiciones</label>
      </div>

      <p class="aviso">Acepta los términos y condiciones</p>

      <a href="/Pantalla sesion iniciada/index.html"><button type="submit" class="btn-crear">Crear cuenta</button></a>
      <a href="/Iniciar Sesion/index.html" class="login-link">Ya tienes cuenta?</a>
    </form>
  </div>
</body>
</html>
