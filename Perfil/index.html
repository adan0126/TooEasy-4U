<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="header">
  <div class="logo">
    <h1>TOO-EASY</h1>
    <p>JUEGA HOY, TRIUNFA MAÑANA</p>
  </div>
  <nav class="nav">
    <a href="/Pantalla sesion iniciada/index.html">INICIO</a>
    <a href="/Lecciones/index.html">LECCIONES</a>
    <a href="/Perfil/">PERFIL</a>
    <a href="/Pantalla de inicio/index.html"><img src="./icon/salida.png" alt="Salir"></a>
  </nav>
</header>

<main class="perfil">
  <div class="perfil-container">
    <div class="foto-perfil" id="fotoPerfil">
      <img id="imagenPerfil" src="./img/perfil.jpg" alt="Foto de perfil">
      <div class="editar-icono" id="editarFoto">
        <img src="./icon/lapiz.png" alt="Editar foto">
      </div>
    </div>
    <input type="file" id="inputFoto" accept="image/*" style="display: none;">
    <input type="text" class="input-usuario" id="nombreUsuario" readonly>
    <button id="cerrarSesion">Cerrar sesión</button>
  </div>
</main>

<script src="./script.js"></script>
</body>
</html>
