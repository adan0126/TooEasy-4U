<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lección - Tarjetas de Débito</title>
  <link rel="stylesheet" href="./css/preguntas.css" />
</head>
<body>
  <main class="contenedor-quiz">
    <div class="lado-izquierdo">
      <img id="imagenPregunta" src="" alt="Imagen de la pregunta">
    </div>

    <div class="lado-derecho">
      <div class="progreso-container">
        <div class="progreso"></div>
      </div>

      <h2 id="textoPregunta">Pregunta</h2>

      <div id="opcionesContainer" class="opciones"></div>

      <button id="botonComprobar" class="boton-comprobar">Comprobar respuesta</button>

      <div id="resultado" class="resultado"></div>
    </div>
  </main>

  <script src="./js/preguntas.js"></script>
</body>
</html>
